// Auto-create local.properties from ANDROID_HOME if it doesn't exist (gitignored, missing on fresh clone)
def localPropertiesFile = rootProject.file("local.properties")
if (!localPropertiesFile.exists()) {
    def sdkDir = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
    if (sdkDir != null && !sdkDir.isEmpty()) {
        localPropertiesFile.text = "sdk.dir=${sdkDir.replace('\\', '/')}\n"
        println "Created local.properties with sdk.dir=$sdkDir"
    }
}

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"
